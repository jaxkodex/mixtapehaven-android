name: Android CI

permissions:
  pull-requests: write
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    # Only needed if the shared debug keystore uses non-default credentials; unset secrets come
    # through empty and the build falls back to the standard debug key values.
    env:
      MIXTAPE_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
      MIXTAPE_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
      MIXTAPE_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Signs debug APKs with the project's shared debug key so a build from here installs over
      # a locally built one. Fork PRs don't get repository secrets, so the secret is optional and
      # the build falls back to a runner-generated key when it's absent.
      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::notice::DEBUG_KEYSTORE_BASE64 is not set; this APK is signed with a throwaway key and will not install over other builds."
            exit 0
          fi
          keystore="$RUNNER_TEMP/debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "MIXTAPE_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Run Lint
        run: ./gradlew lint

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html

      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: app/build/reports/detekt/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug-${{ github.event.pull_request.number || github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Comment PR with APK download link
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.issue.number;
            const commitSha = context.sha.substring(0, 7);
            const branchName = context.payload.pull_request.head.ref;
            const runId = context.runId;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            
            const artifactName = 'apk-debug-' + prNumber;
            const artifactUrl = 'https://github.com/' + repoOwner + '/' + repoName + '/actions/runs/' + runId;
            
            const commentBody = '## 📱 APK Ready for Testing\n\n' +
              '**Build Details:**\n' +
              '- PR: #' + prNumber + '\n' +
              '- Commit: `' + commitSha + '`\n' +
              '- Branch: `' + branchName + '`\n\n' +
              '**Download:**\n' +
              '1. Go to the [workflow run page](' + artifactUrl + ')\n' +
              '2. Scroll down to the **Artifacts** section\n' +
              '3. Download the `apk-debug-' + prNumber + '` artifact\n' +
              '4. Extract the ZIP file to get the APK\n\n' +
              '**Installation:**\n' +
              '1. Download and extract the APK file\n' +
              '2. Enable "Install from unknown sources" on your Android device\n' +
              '3. Open the APK file to install\n\n' +
              '---\n\n' +
              '*This comment was automatically generated by GitHub Actions*';

            // Find existing comment to update or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: repoOwner,
              repo: repoName,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('APK Ready for Testing')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: repoOwner,
                repo: repoName,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: prNumber,
                body: commentBody,
              });
            }
