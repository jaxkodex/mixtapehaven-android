name: Google Play alpha

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Each push waits independently so even out-of-order workflow starts retain a run
      # for the newest commit. Manual dispatches bypass the wait.
      - name: Wait for a quiet period
        if: github.event_name == 'push'
        run: sleep 900

  alpha:
    needs: settle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Never cancel an upload in progress. Play edits, version selection, and uploads
    # must be serialized; stale queued runs are skipped by the checks below.
    concurrency:
      group: google-play-alpha
      queue: max

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check whether this is still the latest commit
        id: initial_head
        run: bash .github/scripts/check-play-head.sh

      - name: Test Play release scripts
        if: steps.initial_head.outputs.current == 'true'
        run: |
          bash .github/scripts/check-play-head.test.sh
          node --test .github/scripts/play-version.test.mjs

      - name: Configure Play credentials
        if: steps.initial_head.outputs.current == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set; see README.md > Google Play alpha releases."
            exit 1
          fi
          credentials="$RUNNER_TEMP/play-service-account.json"
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$credentials"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials" >> "$GITHUB_ENV"

      - name: Choose Play version code
        id: version
        if: steps.initial_head.outputs.current == 'true'
        env:
          PLAY_VERSION_CODE_FLOOR: ${{ vars.PLAY_VERSION_CODE_FLOOR || '0' }}
        run: |
          set -euo pipefail
          PLAY_ACCESS_TOKEN=$(gcloud auth application-default print-access-token \
            --scopes=https://www.googleapis.com/auth/androidpublisher)
          echo "::add-mask::$PLAY_ACCESS_TOKEN"
          export PLAY_ACCESS_TOKEN
          node .github/scripts/play-version.mjs >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.initial_head.outputs.current == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        if: steps.initial_head.outputs.current == 'true'
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        if: steps.initial_head.outputs.current == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode release keystore
        if: steps.initial_head.outputs.current == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set; cannot sign the Play bundle."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release-keystore.jks"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "MIXTAPE_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        if: steps.initial_head.outputs.current == 'true'
        env:
          MIXTAPE_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MIXTAPE_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MIXTAPE_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PLAY_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease -PplayVersionCode="$PLAY_VERSION_CODE"

      - name: Verify bundle signing key
        if: steps.initial_head.outputs.current == 'true'
        run: |
          set -euo pipefail
          bundle=app/build/outputs/bundle/release/app-release.aab
          test -f "$bundle"
          if ! jarsigner -verify "$bundle" > "$RUNNER_TEMP/jarsigner.log" 2>&1; then
            cat "$RUNNER_TEMP/jarsigner.log"
            exit 1
          fi
          cert=$(keytool -printcert -jarfile "$bundle" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected=03d74bfb5f0e87af50452ab3b44fce6f98dca919ea6b705e4bb8c469ca617abc
          if [ "$cert" != "$expected" ]; then
            echo "::error::The bundle is unsigned or does not use the expected release signing key."
            exit 1
          fi

      - name: Check for newer commits before upload
        id: upload_head
        if: steps.initial_head.outputs.current == 'true'
        run: bash .github/scripts/check-play-head.sh

      - name: Release to Google Play alpha
        if: steps.upload_head.outputs.current == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          packageName: pe.net.libre.mixtapehaven
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
          releaseName: alpha-${{ github.sha }}

      - name: Summarize release
        if: steps.upload_head.outputs.current == 'true'
        env:
          PLAY_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          {
            echo "### Google Play alpha release submitted"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version code: \`$PLAY_VERSION_CODE\`"
            echo "- Track: alpha"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json" "$RUNNER_TEMP/release-keystore.jks"
